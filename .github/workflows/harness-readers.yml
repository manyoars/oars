name: harness-readers

# Weekly, not daily: GitHub Actions minutes are shared. Two checks, both here and never in `ci`, so a harness release cannot redden main or a
# task branch. The reader tests read static made-up fixtures, so they stay green when a harness changes its format. The version watch is the
# red signal: it fails the run when a harness's latest npm release is past the allowance in versions.json (default: a different minor from
# the version its fixture was modeled on), naming the harness and both versions. It pushes nothing.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Reader fixture tests
        run: |
          export HOME="$RUNNER_TEMP/home" APPDATA="$RUNNER_TEMP/appdata" XDG_CONFIG_HOME="$RUNNER_TEMP/xdg"
          npx vitest run src/sessions/harness-fixtures
        working-directory: packages/cli
      # Only harnesses with a public npm package are checked; the others (Cursor, VS Code Copilot Chat, Grok Build) have none here.
      # `npm view` reads the registry and installs nothing, and no harness runs, so no real store is read; HOME and the config
      # folders still point at a temporary folder before any command. The script prints every latest version and exits 1 on a stale one.
      - name: Version watch
        if: ${{ !cancelled() }}
        run: |
          export HOME="$RUNNER_TEMP/home" APPDATA="$RUNNER_TEMP/appdata" XDG_CONFIG_HOME="$RUNNER_TEMP/xdg"
          mkdir -p "$HOME" "$APPDATA" "$XDG_CONFIG_HOME"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node packages/cli/src/sessions/harness-fixtures/version-watch.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status="${PIPESTATUS[0]}"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
