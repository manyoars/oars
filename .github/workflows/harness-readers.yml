name: harness-readers

# Weekly, not daily: GitHub Actions minutes are shared. Reruns the per-reader fixture tests and reports which harness versions are
# current on npm, so a release that changes a transcript format is seen as a version line next to one red reader. It pushes nothing.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Only harnesses with a public npm package are listed; the others (Cursor, VS Code Copilot Chat, Grok Build) have no npm install here.
      # `npm view` reads the registry and installs nothing, and no harness runs, so no real store is read; HOME and the config
      # folders still point at a temporary folder before any command.
      - name: Latest harness releases
        env:
          HARNESS_PACKAGES: '@anthropic-ai/claude-code @openai/codex @github/copilot @google/gemini-cli opencode-ai @earendil-works/pi-coding-agent'
        run: |
          export HOME="$RUNNER_TEMP/home" APPDATA="$RUNNER_TEMP/appdata" XDG_CONFIG_HOME="$RUNNER_TEMP/xdg"
          mkdir -p "$HOME" "$APPDATA" "$XDG_CONFIG_HOME"
          for pkg in $HARNESS_PACKAGES; do
            version="$(npm view "$pkg" version 2>/dev/null || echo unavailable)"
            echo "$pkg $version"
            echo "- $pkg: $version" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Reader fixture tests
        run: |
          export HOME="$RUNNER_TEMP/home" APPDATA="$RUNNER_TEMP/appdata" XDG_CONFIG_HOME="$RUNNER_TEMP/xdg"
          npx vitest run src/sessions/harness-fixtures
        working-directory: packages/cli
