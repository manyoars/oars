name: release-cli

# Publishes @manyoars/oars (the `oars` command) to npm on a tag cli-v<semver>. Two jobs, so no code from a dependency ever runs while a job can mint the publishing
# token (OIDC):
#   build   contents: read only. Checks the tag (semver, matches packages/cli/package.json, commit is on main), installs, runs the same
#           `just check` as ci, and packs the tarball (the package's prepack rebuilds dist/, so it is never a stale build).
#   publish id-token: write only. No checkout and no install: it downloads that tarball and runs `npm publish <tarball> --provenance
#           --ignore-scripts`. Provenance names this repository and this workflow file.
#   release contents: write only. After publish succeeds it creates the GitHub Release for the tag (title `oars <version>`, notes the matching
#           section of packages/cli/CHANGELOG.md, marked Latest), so the repository page shows the tool and not a template release.
# A manual run with the `tag` input works on an existing tag and never pushes or moves one. By default it runs only the release job (no build, no
# npm publish); it updates the release when one exists. Backfill: gh workflow run release-cli.yml -f tag=cli-v0.4.1 -f latest=true
# The default for a tag whose push run failed is a new patch tag, tagged on a commit that is on main. `publish=true` is a recovery tool: it runs
# the whole pipeline (build, publish, release) on that tag's code with this workflow file, but its provenance names the dispatch ref and sha, not
# the tag's commit: gh workflow run release-cli.yml -f tag=cli-v<semver> -f latest=true -f publish=true
# Start it from main: the tag's commit must still be an ancestor of main, and the run's workflow file is main's.
#
# Auth: npm trusted publishing (OIDC), no stored secret. The package's trusted publisher on npmjs.com names the GitHub
# Actions repository manyoars/oars and the workflow file release-cli.yml (both case-sensitive, no environment), so do
# not rename this file or add an environment.
on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag (cli-v<semver>) to work on; with publish off, only the GitHub Release is created or updated
        required: true
        type: string
      latest:
        description: Mark the release Latest (only the newest version should be; a prerelease never is)
        required: false
        type: boolean
        default: false
      publish:
        description: "Also build and publish the tag's code to npm before the release (recovery only: provenance names the dispatch sha, not the tag's commit); leave off for a backfill"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The tag being published: the pushed tag, or the manual run's input.
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-cli-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: (github.event_name == 'push' || inputs.publish) && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    # GitHub-hosted runners only: this repository is public.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history, so the ancestry check below can tell a commit on main from one that is not. No credentials are kept in .git/config:
      # the install scripts `npm ci` runs must not find a token there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # The tag's code, not the branch a manual run started on (a push already is at the tag).
          ref: refs/tags/${{ env.TAG }}
      - name: Check the tag is cli-v<semver> (no prerelease) and matches the package version
        run: |
          semver="${TAG#cli-v}"
          if ! printf '%s' "$semver" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::$TAG is not cli-v<major.minor.patch> (prerelease tags are not published)"
            exit 1
          fi
          package="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$semver" != "$package" ]; then
            echo "::error::$TAG does not match packages/cli/package.json version $package"
            exit 1
          fi
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          tagged="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$tagged" FETCH_HEAD; then
            echo "::error::$TAG points at $tagged, which is not on main, so it is not published"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: npm ci
      - run: just check
      - name: Pack the tarball that will be published
        # `npm pack` does not create the destination (run 42827858620 failed with ENOENT), and a relative one resolves against the repo root.
        run: |
          mkdir -p release-pack
          npm pack -w packages/cli --pack-destination release-pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: release-pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: (github.event_name == 'push' || inputs.publish) && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # npm trusted publishing and the signed provenance statement; nothing else, and no checkout
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: release-pack
      - name: Check npm supports trusted publishing (11.5.1 or later)
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi
      - name: Check the tarball is the one tagged
        run: |
          set -- release-pack/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one tarball in release-pack, found $#"
            exit 1
          fi
          packed="$(tar -xzOf "$1" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if [ "${TAG#cli-v}" != "$packed" ]; then
            echo "::error::$TAG does not match the tarball's version $packed"
            exit 1
          fi
      # --ignore-scripts and a tarball argument: nothing from the package or its dependencies runs in this job. The path must start with
      # `./`: npm reads a bare `release-pack/x.tgz` as GitHub shorthand (`github:release-pack/x.tgz`) and would fetch that repository.
      - name: Publish
        run: npm publish ./release-pack/*.tgz --provenance --access public --ignore-scripts

  release:
    needs: publish
    # A push (or a manual run with publish) gets here only after publish succeeded; a plain manual run skips build and publish, so this job must not
    # wait on them being green.
    if: ${{ !cancelled() && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.publish)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create or edit the release; nothing else, and no npm credential
    env:
      GH_TOKEN: ${{ github.token }}
      # A tag push is always the newest release; a manual backfill says so with the input.
      LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.latest || github.event_name == 'push' }}
    steps:
      # The default ref: the tagged commit on a push, and the branch the run was started on (main) for a backfill. The script and the
      # changelog come from there, so an old tag that predates the script still gets its notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Create or update the GitHub Release
        run: |
          case "$TAG" in cli-v*) ;; *) echo "::error::$TAG is not a cli-v<semver> tag"; exit 1 ;; esac
          version="${TAG#cli-v}"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not cli-v<semver>"
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          # A prerelease is never Latest.
          latest="$LATEST"
          if [ "$prerelease" = true ]; then latest=false; fi
          node scripts/changelog-section.mjs "$version" > release-notes.md
          # --verify-tag: a typo in the input must not create a tag on the default branch.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "oars $version" --notes-file release-notes.md --prerelease="$prerelease" --latest="$latest"
          else
            gh release create "$TAG" --verify-tag --title "oars $version" --notes-file release-notes.md --prerelease="$prerelease" --latest="$latest"
          fi
