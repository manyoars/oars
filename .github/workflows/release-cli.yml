name: release-cli

# Publishes @manyoars/oars (the `oars` command) to npm on a tag cli-v<semver>: the same `just check` as ci, a guard that the tag's
# version is packages/cli/package.json's, then `npm publish` with provenance. The package's prepack rebuilds dist/ and copies in
# the golden deploy plans (parity/deploy-plans/), so the upload is never a stale build. No such tag exists until the first release.
#
# Auth: npm trusted publishing (OIDC), no stored secret. The package's trusted publisher on npmjs.com names the GitHub
# Actions repository manyoars/oars and the workflow file release-cli.yml (both case-sensitive, no environment), so do
# not rename this file or add an environment.
on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing and the signed provenance statement

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # GitHub-hosted runners only: this repository is public.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag is cli-v<semver> (no prerelease) and matches the package version
        run: |
          semver="${GITHUB_REF_NAME#cli-v}"
          if ! printf '%s' "$semver" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::$GITHUB_REF_NAME is not cli-v<major.minor.patch> (prerelease tags are not published)"
            exit 1
          fi
          package="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$semver" != "$package" ]; then
            echo "::error::$GITHUB_REF_NAME does not match packages/cli/package.json version $package"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: npm ci
      - run: just check
      - name: Check npm supports trusted publishing (11.5.1 or later)
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi
      - name: Publish
        run: npm publish -w packages/cli --provenance --access public
