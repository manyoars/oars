name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live-login:
        description: Also run the live login against a throwaway Keycloak (needs the OARS_LIVE_* secrets)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push cancels the older run only on task/* and claude/* branches (the orchestrator's worker branches, which push several
# times a minute), where every run of the same branch shares one group (ci-<ref>-worker). Any other ref (main, tags, pull requests) gets a group of its own per
# run, so nothing queues behind another run and nothing is cancelled: a landed sha always keeps its result.
concurrency:
  group: ci-${{ github.ref }}-${{ (startsWith(github.ref, 'refs/heads/task/') || startsWith(github.ref, 'refs/heads/claude/')) && 'worker' || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/task/') || startsWith(github.ref, 'refs/heads/claude/') }}

jobs:
  check:
    name: check (${{ matrix.os }})
    # GitHub-hosted runners only: this repository is public. The lead's gate reads both legs, so Windows is a leg of its own and
    # neither leg may cancel the other.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: npm ci
      - run: just check

  # Known advisories in what ships (high or critical). A separate job, not part of `just check`: it asks the registry, so a newly
  # published advisory turns this job red on its own and never an unrelated pull request's `check`.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: npm ci
      - run: just audit

  # Opt-in (Actions > ci > Run workflow > live-login): the CLI's device flow against a real Keycloak holding T67's realm, with
  # Playwright approving the code on the verification page. The realm file lives in the private platform repo, so the job reads
  # it with a token; a user of that realm comes from the OARS_LIVE_* secrets. Nothing else of the platform runs: a stub answers
  # the token exchange, so the check covers Keycloak, the device flow and the CLI.
  live-login:
    if: github.event_name == 'workflow_dispatch' && inputs.live-login
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # persist-credentials: false keeps both tokens out of .git/config, and the login secrets reach only the last step, so
      # none of them is readable by the install scripts `npm ci` runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ secrets.OARS_LIVE_REALM_REPOSITORY }}
          token: ${{ secrets.OARS_LIVE_REALM_READ_TOKEN }}
          path: .platform-checkout
          sparse-checkout: k8s/keycloak-realm.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: just live-keycloak .platform-checkout/k8s/keycloak-realm.json
      - run: curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors --output /dev/null http://localhost:8180/realms/aor/.well-known/openid-configuration
      - run: just live-login
        env:
          OARS_LIVE_USERNAME: ${{ secrets.OARS_LIVE_USERNAME }}
          OARS_LIVE_PASSWORD: ${{ secrets.OARS_LIVE_PASSWORD }}
          OARS_LIVE_AUDIENCE: ${{ secrets.OARS_LIVE_AUDIENCE }}
