name: template-per-task-agent

# Releases the per-task-agent image on a tag per-task-agent-v<semver>: the template's tests, the container smoke test, then
# a push to ghcr.io/manyoars/per-task-agent:<semver> with build provenance and the digest in the release notes. No such tag
# exists until the first release (t337), so this workflow has not pushed an image yet.
on:
  push:
    tags: ['per-task-agent-v*']

permissions:
  contents: write # the release notes
  packages: write # ghcr.io/manyoars/per-task-agent
  id-token: write # signs the provenance attestation
  attestations: write

concurrency:
  group: template-per-task-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/manyoars/per-task-agent

jobs:
  release:
    # GitHub-hosted runners only: this repository is public.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the version from the tag
        id: version
        run: |
          semver="${GITHUB_REF_NAME#per-task-agent-v}"
          if ! printf '%s' "$semver" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not per-task-agent-v<semver>"
            exit 1
          fi
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The client's entry is its built dist/, which a fresh checkout lacks, so build it before any typecheck, test, or build.
      - run: npm run build -w packages/client
      - run: npm run typecheck -w templates/per-task-agent
      - run: npm test -w templates/per-task-agent
      - run: npm run test:monorepo -w templates/per-task-agent
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built once into the local daemon for the smoke test; the push below reuses this builder's layers, so what ships is
      # what was tested.
      - name: Build the image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: templates/per-task-agent/Dockerfile
          platforms: linux/amd64
          load: true
          tags: per-task-agent:smoke
      - name: Container smoke test
        env:
          OARS_SMOKE_IMAGE: per-task-agent:smoke
        run: npm run test:smoke -w templates/per-task-agent
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: templates/per-task-agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.semver }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.semver }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Catalogs pin image@sha256:<digest>, never a tag, so the digest goes where the release's reader looks first.
      - name: Write the digest into the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SEMVER: ${{ steps.version.outputs.semver }}
        run: |
          notes="$(printf 'Image: `%s@%s`\n\nPin this reference in a catalog entry, not the tag.\n' "$IMAGE" "$DIGEST")"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "per-task-agent $SEMVER" --notes "$notes"
          fi
