name: release-client

# Publishes @manyoars/oars-client to npm on a tag client-v<semver>. Two jobs, so no code from a dependency ever runs while a job can mint the publishing
# token (OIDC):
#   build   contents: read only. Checks the tag (semver, matches packages/client/package.json, commit is on main), installs, runs the same
#           `just check` as ci, and packs the tarball (the package's prepack rebuilds dist/, so it is never a stale build).
#   publish id-token: write only. No checkout and no install: it downloads that tarball and runs `npm publish <tarball> --provenance
#           --ignore-scripts`. Provenance names this repository and this workflow file.
# No such tag exists until the first release.
#
# Auth: npm trusted publishing (OIDC), no stored secret. The package's trusted publisher on npmjs.com names the GitHub
# Actions repository manyoars/oars and the workflow file release-client.yml (both case-sensitive, no environment), so do
# not rename this file or add an environment.
on:
  push:
    tags: ['client-v*']

permissions:
  contents: read

concurrency:
  group: release-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # GitHub-hosted runners only: this repository is public.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history, so the ancestry check below can tell a commit on main from one that is not. No credentials are kept in .git/config:
      # the install scripts `npm ci` runs must not find a token there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is client-v<semver> (no prerelease) and matches the package version
        run: |
          semver="${GITHUB_REF_NAME#client-v}"
          if ! printf '%s' "$semver" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::$GITHUB_REF_NAME is not client-v<major.minor.patch> (prerelease tags are not published)"
            exit 1
          fi
          package="$(node -p "require('./packages/client/package.json').version")"
          if [ "$semver" != "$package" ]; then
            echo "::error::$GITHUB_REF_NAME does not match packages/client/package.json version $package"
            exit 1
          fi
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main, so it is not published"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: npm ci
      - run: just check
      - name: Pack the tarball that will be published
        run: npm pack -w packages/client --pack-destination release-pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: release-pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # npm trusted publishing and the signed provenance statement; nothing else, and no checkout
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: release-pack
      - name: Check npm supports trusted publishing (11.5.1 or later)
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi
      - name: Check the tarball is the one tagged
        run: |
          set -- release-pack/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one tarball in release-pack, found $#"
            exit 1
          fi
          packed="$(tar -xzOf "$1" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if [ "${GITHUB_REF_NAME#client-v}" != "$packed" ]; then
            echo "::error::$GITHUB_REF_NAME does not match the tarball's version $packed"
            exit 1
          fi
      # --ignore-scripts and a tarball argument: nothing from the package or its dependencies runs in this job.
      - name: Publish
        run: npm publish release-pack/*.tgz --provenance --access public --ignore-scripts
